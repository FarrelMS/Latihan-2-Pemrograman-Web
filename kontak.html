  <body>
    <header>
      <div class="logo-container">
        <img src="img/logo.png" alt="Logo SMA Kristen Peta 1" />

    <section>
      <h2>Hubungi Kami</h2>
      <p>
        Jika Anda memiliki pertanyaan seputar pendaftaran, informasi sekolah,
        atau keperluan lainnya, silakan isi formulir di bawah ini.
      </p>

      <form action="#" method="POST">
        <label for="nama">Nama Lengkap</label>
        <input
          type="text"
          id="nama"
          name="nama"
          placeholder="Masukkan nama lengkap Anda"
          required
        />

        <label for="email">Alamat Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="contoh@email.com"
          required
        />

        <label for="pesan">Pesan / Pertanyaan</label>
        <textarea
          id="pesan"
          name="pesan"
          rows="6"
          placeholder="Ketik pesan Anda di sini..."
          required
        ></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
    </section>

    </footer>
